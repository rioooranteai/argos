services:
  argos-api:
    build: .
    container_name: argos_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Simpan semua data di /app/data supaya cukup satu volume folder
      SQLITE_PATH: /app/data/competitor_data.db
      CHROMA_PATH: /app/data/chroma_db
      # Cache model Docling/HuggingFace agar tidak download ulang tiap restart
      HF_HOME: /app/data/hf_cache
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
