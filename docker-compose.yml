services:
  argos-api:
    build: .
    container_name: argos_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Nilai infrastruktur per mesin (bukan rahasia, tidak di .env).
      # Semua data (SQLite, Chroma, antrean upload) ada di DATA_DIR.
      DATA_DIR: /app/data
      DOCLING_DEVICE: auto
      # Cache model Docling/HuggingFace agar tidak download ulang tiap restart
      HF_HOME: /app/data/hf_cache
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
