# Override for running with an NVIDIA GPU.
# Usage:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Needs:  an NVIDIA driver + Docker Desktop (WSL2), or the NVIDIA Container Toolkit on Linux.
services:
  argos-api:
    build:
      args:
        TORCH_INDEX: cu129
    environment:
      DOCLING_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
