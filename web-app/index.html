<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Argos — Competitive Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@400;600;700&display=swap"
          rel="stylesheet">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app-wrapper">

    <aside class="sidebar" id="sidebar">

        <!-- Brand Header -->
        <div class="sidebar-header">
            <div class="brand-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36"
                     width="160" height="36" style="display:block;" aria-label="ArgosAI">
                    <defs>
                        <linearGradient id="argos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e27c4a"/>
                            <stop offset="100%" stop-color="#d96245"/>
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#argos-bg)"/>
                    <path d="M18 7 L8 30 M18 7 L28 30"
                          fill="none" stroke="white" stroke-width="1"
                          stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="14.5" y1="22" x2="21.5" y2="22"
                          stroke="white" stroke-width="1" stroke-linecap="round"/>
                    <circle cx="18" cy="16" r="2.2" fill="white"/>
                    <text x="46" y="24"
                          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
                          font-size="23" letter-spacing="-0.5"
                          fill="currentColor">
                        <tspan font-weight="600">Argos</tspan><tspan font-weight="300" opacity="0.4">AI</tspan>
                    </text>
                </svg>
            </div>
            <button class="btn-close-sidebar" onclick="toggleSidebar()" title="Close menu" aria-label="Close menu">
                <svg fill="none" height="16" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </div>

        <!-- Notebook switcher -->
        <div class="notebook-switcher">
            <button type="button" class="notebook-current" id="notebookBtn"
                    aria-haspopup="menu" aria-expanded="false">
                <svg class="notebook-glyph" fill="none" height="16" stroke="currentColor" stroke-width="1.8"
                     viewBox="0 0 24 24" width="16" aria-hidden="true">
                    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/>
                    <path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/>
                </svg>
                <span class="notebook-current-title" id="notebookTitle">Loading notebook…</span>
                <svg class="notebook-chevron" fill="none" height="14" stroke="currentColor" stroke-width="2"
                     viewBox="0 0 24 24" width="14" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"/>
                </svg>
            </button>
            <div class="notebook-menu" id="notebookMenu" role="menu" hidden>
                <div class="notebook-menu-list" id="notebookMenuList"></div>
                <div class="user-menu-divider"></div>
                <button type="button" class="user-menu-item" id="newNotebookBtn" role="menuitem">
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    New notebook
                </button>
                <button type="button" class="user-menu-item" id="renameNotebookBtn" role="menuitem">
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
                    </svg>
                    Rename notebook
                </button>
                <button type="button" class="user-menu-item user-menu-item--danger" id="deleteNotebookBtn" role="menuitem">
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                    </svg>
                    Delete notebook
                </button>
            </div>
        </div>

        <!-- Sources -->
        <section class="sources-section" aria-labelledby="sourcesHeading">
            <div class="section-header">
                <h2 class="section-title" id="sourcesHeading">Sources</h2>
                <span class="section-count" id="sourceCount">0/10</span>
                <button type="button" class="btn-add-source" id="addSourceBtn">
                    <svg fill="none" height="13" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" width="13">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add
                </button>
            </div>
            <ul class="source-list" id="sourceList" aria-describedby="sourceHint"></ul>
            <p class="source-hint" id="sourceHint">Only checked sources are used to answer.</p>
        </section>

        <!-- Conversations -->
        <section class="history-section" aria-labelledby="historyHeading">
            <div class="history-section-header">
                <h2 class="history-title" id="historyHeading">Conversations</h2>
                <button type="button" class="btn-new-thread" id="newChatBtn" title="Start a new conversation">
                    <svg fill="none" height="13" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" width="13">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    New chat
                </button>
            </div>
            <div class="history-list" id="historyList"></div>
        </section>

        <!-- Sidebar Footer — user profile -->
        <div class="sidebar-footer">
            <button type="button" class="user-pill" id="userPillBtn" aria-haspopup="menu" aria-expanded="false">
                <div class="user-pill-avatar" id="userAvatar">
                    <span class="user-pill-avatar-fallback" id="userAvatarFallback">U</span>
                </div>
                <span class="user-pill-name" id="userName">Loading…</span>
                <svg class="user-pill-chevron" fill="none" height="14" stroke="currentColor" stroke-width="2"
                     viewBox="0 0 24 24" width="14">
                    <circle cx="12" cy="5"  r="1.4"/>
                    <circle cx="12" cy="12" r="1.4"/>
                    <circle cx="12" cy="19" r="1.4"/>
                </svg>
            </button>

            <div class="user-menu" id="userMenu" role="menu" hidden>
                <div class="user-menu-header">
                    <div class="user-menu-name"  id="userMenuName">User</div>
                    <div class="user-menu-email" id="userMenuEmail"></div>
                </div>
                <div class="user-menu-divider"></div>
                <button type="button" class="user-menu-item" id="manageUsersBtn" role="menuitem" hidden>
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    Manage users
                </button>
                <button type="button" class="user-menu-item user-menu-item--danger" id="logoutBtn" role="menuitem">
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" x2="9" y1="12" y2="12"/>
                    </svg>
                    Sign out
                </button>
            </div>
        </div>

    </aside>

    <main class="chat-main">

        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <button class="btn-menu-toggle" onclick="toggleSidebar()" title="Open menu" aria-label="Open menu">
                    <svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18">
                        <line x1="3" x2="21" y1="6" y2="6"/>
                        <line x1="3" x2="21" y1="12" y2="12"/>
                        <line x1="3" x2="21" y1="18" y2="18"/>
                    </svg>
                </button>
                <span class="header-title" id="chatHeaderTitle">New chat</span>
            </div>
            <div class="header-actions">
                <span class="header-scope" id="headerScope"></span>
                <button class="header-icon-btn" id="renameThreadBtn" title="Rename conversation" aria-label="Rename conversation" hidden>
                    <svg fill="none" height="16" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
                    </svg>
                </button>
                <button class="header-icon-btn" id="deleteThreadBtn" title="Delete conversation" aria-label="Delete conversation" hidden>
                    <svg fill="none" height="16" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Welcome / empty states (JS sets the content based on the sources) -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon" aria-hidden="true">
                <svg fill="none" height="30" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="30">
                    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/>
                    <path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/>
                </svg>
            </div>
            <h1 class="welcome-title" id="welcomeTitle">Welcome to Argos</h1>
            <p class="welcome-subtitle" id="welcomeSubtitle"></p>
            <button type="button" class="welcome-cta" id="welcomeCta" hidden>Add sources</button>
            <div class="welcome-suggestions" id="welcomeSuggestions" hidden>
                <button class="welcome-suggestion" data-prompt="Compare the prices of every product in the selected sources.">
                    Compare product prices
                </button>
                <button class="welcome-suggestion" data-prompt="What are the main weaknesses of the products in these sources?">
                    Find product weaknesses
                </button>
                <button class="welcome-suggestion" data-prompt="Summarize the key features of every product in these sources.">
                    Summarize key features
                </button>
            </div>
        </div>

        <!-- Chat messages -->
        <div class="chat-box" id="chatBox" hidden aria-live="polite"></div>

        <!-- Typing indicator -->
        <div class="loading-container" id="chatLoading">
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input area -->
        <div class="input-container">
            <div class="input-wrapper">
                <button class="btn-icon btn-attach" id="attachBtn" title="Add sources" aria-label="Add sources">
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <input autocomplete="off" id="chatInput" placeholder="Ask something about your sources…" type="text"
                       aria-label="Message">
                <button class="btn-icon btn-mic" id="micBtn" title="Record voice" aria-label="Record voice">
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" x2="12" y1="19" y2="23"/>
                        <line x1="8" x2="16" y1="23" y2="23"/>
                    </svg>
                </button>
                <button class="btn-icon btn-send" id="sendBtn" title="Send" aria-label="Send">
                    <svg fill="none" height="15" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15">
                        <line x1="22" x2="11" y1="2" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <p class="input-disclaimer">Argos can make mistakes. Check the sources of every answer.</p>
        </div>

    </main>

</div>

<!-- ── Modal: Add sources ─────────────────────────────────────────── -->
<div class="modal-overlay" id="sourceModal" hidden>
    <div class="modal-card source-modal" role="dialog" aria-modal="true" aria-labelledby="sourceModalTitle">
        <header class="source-modal-header">
            <div>
                <h2 class="source-modal-title" id="sourceModalTitle">Add sources</h2>
                <p class="source-modal-slots" id="sourceModalSlots"></p>
            </div>
            <button type="button" class="btn-modal-close" id="sourceModalClose" aria-label="Close">
                <svg fill="none" height="16" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </header>

        <div class="source-tabs" role="tablist" aria-label="How to add sources">
            <button type="button" class="source-tab" role="tab" id="tabUpload" aria-controls="panelUpload"
                    aria-selected="true">New upload</button>
            <button type="button" class="source-tab" role="tab" id="tabLibrary" aria-controls="panelLibrary"
                    aria-selected="false" tabindex="-1">From Library</button>
        </div>

        <!-- Upload -->
        <div class="source-panel" role="tabpanel" id="panelUpload" aria-labelledby="tabUpload">
            <label class="dropzone" id="dropzone">
                <input type="file" id="uploadInput" accept=".pdf,.md" multiple class="visually-hidden">
                <svg fill="none" height="22" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="22" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" x2="12" y1="3" y2="15"/>
                </svg>
                <span class="dropzone-title">Drag files here or <u>choose from your computer</u></span>
                <span class="dropzone-limits" id="dropzoneLimits">PDF or Markdown, max. 10 MB per file, 5 files at a time</span>
            </label>
            <ul class="pick-list" id="uploadList"></ul>
        </div>

        <!-- Library -->
        <div class="source-panel" role="tabpanel" id="panelLibrary" aria-labelledby="tabLibrary" hidden>
            <div class="library-search">
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="search" id="librarySearch" placeholder="Search Library documents" aria-label="Search documents">
            </div>
            <ul class="pick-list library-list" id="libraryList"></ul>
        </div>

        <footer class="source-modal-footer">
            <p class="source-modal-note" id="sourceModalNote" role="status"></p>
            <div class="source-modal-actions">
                <button type="button" class="modal-btn modal-btn--ghost" id="sourceModalCancel">Cancel</button>
                <button type="button" class="modal-btn modal-btn--primary" id="sourceModalSubmit" disabled>Add</button>
            </div>
        </footer>
    </div>
</div>

<!-- ── Shared modal: confirm / prompt / info ────────────────────────── -->
<div class="modal-overlay" id="appModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
            <div class="modal-icon" id="modalIcon"></div>
            <h2 class="modal-title" id="modalTitle">Title</h2>
            <p class="modal-subtitle" id="modalSubtitle"></p>
        </div>
        <div class="modal-divider"></div>
        <div class="modal-body" id="modalBody">
            <input class="modal-input" id="modalInput" type="text" autocomplete="off" hidden>
        </div>
        <div class="modal-actions">
            <button type="button" class="modal-btn modal-btn--ghost" id="modalCancelBtn">Cancel</button>
            <button type="button" class="modal-btn modal-btn--primary" id="modalConfirmBtn">OK</button>
        </div>
    </div>
</div>

<!-- Citation popover (one element, positioned by JS) -->
<div class="cite-popover" id="citePopover" role="tooltip" hidden></div>

<!-- Short notification -->
<div class="toast" id="toast" role="status" hidden></div>

<script src="/js/main.js"></script>
</body>
</html>
