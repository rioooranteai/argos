[project]
name = "argos"
version = "1.0.0"
description = "ArgosAI — Competitive Intelligence System (RAG + NL2SQL + Voice)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "rioooranteai" }]

# Loose version ranges. The exact (tested) versions are in requirements.txt.
# PyTorch is deliberately not listed: install.py installs it (CPU/CUDA).
# Keep both in sync, or use pip-tools/uv for a single source of truth.
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "python-multipart>=0.0.20",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "authlib>=1.3,<2.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "itsdangerous>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "openai>=1.55,<2.0",
    "langchain-core>=1.3,<2.0",
    "langchain-openai>=1.1,<2.0",
    "langgraph>=1.1,<2.0",
    "pydantic-ai-slim[openai]>=1.30,<2.0",
    "tiktoken>=0.8,<1.0",
    "docling>=2.151,<3.0",
    "docling-core>=2.106,<3.0",
    "chromadb>=0.5,<2.0",
    "sqlparse>=0.5,<1.0",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE: every `except Exception` must use logger.exception / exc_info=True or re-raise
# (DESIGN_GROUP_C.md §7.2). Deliberate exceptions get `# noqa: BLE001 — <reason>`.
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]  # line length handled by formatter
