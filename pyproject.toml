[project]
name = "argos"
version = "1.0.0"
description = "ArgosAI — Competitive Intelligence System (RAG + NL2SQL + Voice)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "rioooranteai" }]

# The direct dependencies. Every resolved version is pinned in uv.lock (commit it); install with
#   uv sync --extra cpu      or      uv sync --extra gpu      (README §5)
dependencies = [
    # Web / API
    "fastapi==0.119.1",
    "uvicorn[standard]==0.39.0",
    "python-multipart==0.0.22",       # file uploads (FastAPI)

    # Config
    "pydantic==2.12.5",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.2",           # .env loading (pydantic-settings)

    # Auth: Google OAuth, the session JWT (authlib.jose) and the OAuth state cookie
    "authlib==1.6.9",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",            # Starlette SessionMiddleware

    # LLM / agent (OpenAI provider only)
    "openai==1.109.1",
    "langchain-core==1.3.2",
    "langchain-openai==1.1.9",
    "langgraph==1.1.10",
    "pydantic-ai-slim[openai]==1.30.1",
    "tiktoken==0.12.0",

    # Documents: Docling for PDF and Markdown only (layout/table models, OCR, chunking), not every
    # format. Its PyTorch comes from the `cpu` or `gpu` extra below.
    "docling-slim[convert-core,format-pdf,format-markdown,models-local,feat-ocr-rapidocr-onnx,feat-chunking]==2.151.1",
    "docling-core==2.108.0",

    # Vector store
    "chromadb==1.5.5",

    # NL2SQL guard
    "sqlparse==0.5.5",

    # Observability (OpenTelemetry → Langfuse or any OTLP backend)
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
]

# PyTorch variant: pick exactly one. `cpu` runs everywhere; `gpu` is the NVIDIA CUDA build whose
# CUDA version is set by the `pytorch-gpu` index URL below. The PyTorch version lives only here.
[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchvision==0.23.0"]
gpu = ["torch==2.8.0", "torchvision==0.23.0"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

# explicit: only torch/torchvision come from these indexes; everything else from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# The CUDA build for the `gpu` extra. Match it to YOUR GPU and driver (README §5, "GPU: pick the
# CUDA build"): cu126, cu128 or cu129. After changing it run `uv lock`.
[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE: every `except Exception` must use logger.exception / exc_info=True or re-raise
# (DESIGN_GROUP_C.md §7.2). Deliberate exceptions get `# noqa: BLE001 — <reason>`.
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]  # line length handled by formatter
