[project]
name = "argos"
version = "1.0.0"
description = "ArgosAI — Competitive Intelligence System (RAG + NL2SQL + Voice)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "rioooranteai" }]
# Dependencies are not listed here. One source of truth:
#   requirements.in        direct dependencies (edit this)
#   requirements.txt       the lock file generated from it: python scripts/lock.py
#   requirements-torch.txt the PyTorch pins (installed separately as the CPU or CUDA build)
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE: every `except Exception` must use logger.exception / exc_info=True or re-raise
# (DESIGN_GROUP_C.md §7.2). Deliberate exceptions get `# noqa: BLE001 — <reason>`.
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]  # line length handled by formatter
